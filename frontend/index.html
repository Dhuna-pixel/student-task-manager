<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Task Manager</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { max-width: 800px; margin: 30px auto; padding: 0 20px; background-color: #f8f9fa; }
    h1, h2 { color: #333; text-align: center; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    form { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .full-width { grid-column: span 2; }
    input, select, button { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    button { background-color: #007bff; color: white; border: none; cursor: pointer; transition: 0.2s; }
    button:hover { background-color: #0056b3; }
    .task-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #eee; }
    .task-item:last-child { border-bottom: none; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; color: white; }
    .badge-High { background-color: #dc3545; }
    .badge-Medium { background-color: #ffc107; color: #333; }
    .badge-Low { background-color: #28a745; }
    .btn-danger { background-color: #dc3545; }
    .btn-danger:hover { background-color: #bd2130; }
  </style>
</head>
<body>

  <h1>Student Task Manager</h1>

  <!-- Create Task Form -->
  <div class="card">
    <h2>Add New Task</h2>
    <form id="taskForm">
      <input type="text" id="title" placeholder="Task Title (e.g., Assignment 1)" required>
      <input type="text" id="course" placeholder="Course Code (e.g., CS101)" required>
      <input type="date" id="dueDate" required>
      <select id="priority">
        <option value="Low">Low Priority</option>
        <option value="Medium" selected>Medium Priority</option>
        <option value="High">High Priority</option>
      </select>
      <button type="submit" class="full-width">Add Task</button>
    </form>
  </div>

  <!-- Task List -->
  <div class="card">
    <h2>Current Tasks</h2>
    <div id="taskList">Loading tasks...</div>
  </div>

  <script>
    // Local Backend API Endpoint
    const API_BASE = 'http://127.0.0.1:5001/api/tasks';

    // 1. READ: Load all tasks from backend
    async function loadTasks() {
      try {
        const res = await fetch(API_BASE);
        const tasks = await res.json();
        const container = document.getElementById('taskList');
        
        if (tasks.length === 0) {
          container.innerHTML = '<p style="text-align:center;">No tasks found. Add one above!</p>';
          return;
        }

        container.innerHTML = tasks.map(task => `
          <div class="task-item">
            <div>
              <strong>${task.title}</strong> [${task.course}]
              <span class="badge badge-${task.priority}">${task.priority}</span>
              <br>
              <small>Due: ${new Date(task.dueDate).toLocaleDateString()} | Status: <b>${task.status}</b></small>
            </div>
            <div>
              <button onclick="updateStatus('${task._id}', '${task.status}')">Advance Status</button>
              <button class="btn-danger" onclick="deleteTask('${task._id}')">Delete</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('taskList').innerHTML = '<p style="color:red; text-align:center;">Failed to connect to backend server.</p>';
      }
    }

    // 2. CREATE: Add new task
    document.getElementById('taskForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newTask = {
        title: document.getElementById('title').value,
        course: document.getElementById('course').value,
        dueDate: document.getElementById('dueDate').value,
        priority: document.getElementById('priority').value
      };

      await fetch(API_BASE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(newTask)
      });

      document.getElementById('taskForm').reset();
      loadTasks();
    });

    // 3. UPDATE: Cycle status through Pending -> In Progress -> Completed
    async function updateStatus(id, currentStatus) {
      const statusCycle = { 'Pending': 'In Progress', 'In Progress': 'Completed', 'Completed': 'Pending' };
      const nextStatus = statusCycle[currentStatus];

      await fetch(`${API_BASE}/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: nextStatus })
      });

      loadTasks();
    }

    // 4. DELETE: Remove task
    async function deleteTask(id) {
      if (!confirm('Are you sure you want to delete this task?')) return;
      await fetch(`${API_BASE}/${id}`, { method: 'DELETE' });
      loadTasks();
    }

    // Load tasks on startup
    loadTasks();
  </script>
</body>
</html>
